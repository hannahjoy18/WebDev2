<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
    <link th:href="@{/add.css}" rel="stylesheet">
</head>
<body>
<main>
    <h1>Edit Employee</h1>

    <form th:action="@{/update}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <input type="text" th:field="*{name}" placeholder="Name">
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></div>

        <input type="email" th:field="*{email}" placeholder="Email">
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></div>

        <button type="submit">Update</button>
        <a th:href="@{/}">Back</a>
    </form>
</main>
</body>
</html>
