<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Car List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .add-btn {
            display: inline-block;
            margin-bottom: 15px;
            padding: 8px 14px;
            background: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .add-btn:hover {
            background: #45a049;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
            color: #333;
        }

        tr:hover {
            background: #f9f9f9;
        }

        .btn {
            display: inline-block;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-edit {
            background: #2196F3;
            color: white;
        }
        .btn-edit:hover {
            background: #1976D2;
        }

        .btn-delete {
            background: #f44336;
            color: white;
            margin-left: 5px;
        }
        .btn-delete:hover {
            background: #d32f2f;
        }
    </style>
</head>
<body>

<h1>Car List</h1>

<a href="/add" class="add-btn">Add New Car</a>

<table>
    <tr>
        <th>ID</th>
        <th>License Plate</th>
        <th>Make</th>
        <th>Model</th>
        <th>Year</th>
        <th>Color</th>
        <th>Body Type</th>
        <th>Engine Type</th>
        <th>Transmission</th>
        <th>Actions</th>
    </tr>
    <tr th:each="car : ${cars}">
        <td th:text="${car.carId}"></td>
        <td th:text="${car.licensePlateNumber}"></td>
        <td th:text="${car.make}"></td>
        <td th:text="${car.model}"></td>
        <td th:text="${car.year}"></td>
        <td th:text="${car.color}"></td>
        <td th:text="${car.bodyType}"></td>
        <td th:text="${car.engineType}"></td>
        <td th:text="${car.transmission}"></td>
        <td>
            <a th:href="@{/edit(id=${car.carId})}" class="btn btn-edit">Edit</a>
            <a th:href="@{/delete(id=${car.carId})}" class="btn btn-delete"
               onclick="return confirm('Are you sure you want to delete this car?');">Delete</a>
        </td>
    </tr>
</table>

</body>
</html>
