<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Car</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        form {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            font-size: 0.9rem;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-submit {
            background: #4CAF50;
            color: white;
        }
        .btn-submit:hover {
            background: #45a049;
        }

        .btn-cancel {
            background: #999;
            color: white;
            margin-left: 10px;
        }
        .btn-cancel:hover {
            background: #777;
        }
    </style>
</head>
<body>

<h1>Add New Car</h1>

<form th:action="@{/add}" th:object="${car}" method="post">
    <label>License Plate:</label>
    <input type="text" th:field="*{licensePlateNumber}" required />

    <label>Make:</label>
    <input type="text" th:field="*{make}" required />

    <label>Model:</label>
    <input type="text" th:field="*{model}" required />

    <label>Year:</label>
    <input type="number" th:field="*{year}" required />

    <label>Color:</label>
    <input type="text" th:field="*{color}" required />

    <label>Body Type:</label>
    <input type="text" th:field="*{bodyType}" required />

    <label>Engine Type:</label>
    <input type="text" th:field="*{engineType}" required />

    <label>Transmission:</label>
    <input type="text" th:field="*{transmission}" required />

    <button type="submit" class="btn btn-submit">Add Car</button>
    <a href="/" class="btn btn-cancel">Cancel</a>
</form>

</body>
</html>
